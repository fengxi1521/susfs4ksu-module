<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="60" x2="0" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FC6044"/>
      <stop offset="0.55" stop-color="#EE4C2F"/>
      <stop offset="1" stop-color="#CE2D1A"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.22" cy="0.02" r="0.75">
      <stop offset="0" stop-color="#FFBE78" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFBE78" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="0" y1="262" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE7AF"/>
      <stop offset="0.5" stop-color="#FAD98D"/>
      <stop offset="1" stop-color="#F3BE52"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="90" y="60" width="700" height="520" rx="26" ry="26"/>
    </clipPath>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b"/>
      <feOffset in="b" dx="6" dy="14" result="o"/>
      <feFlood flood-color="#000000" flood-opacity="0.28"/>
      <feComposite in2="o" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="iconShadow" x="-30%" y="-30%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feOffset in="b" dx="2" dy="6" result="o"/>
      <feFlood flood-color="#7A1400" flood-opacity="0.45"/>
      <feComposite in2="o" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>


  <g>
    <rect x="90" y="60" width="700" height="520" rx="26" ry="26" fill="url(#cardGrad)"/>
  </g>

  <g clip-path="url(#cardClip)">
    <rect x="90" y="60" width="700" height="520" fill="url(#glow)"/>
  </g>
  <rect x="91" y="61" width="698" height="518" rx="25" ry="25" fill="none"
        stroke="#FFBEA0" stroke-opacity="0.35" stroke-width="2"/>

  <!-- 红包图标 -->
  <g>
    <rect x="152" y="262" width="110" height="138" rx="9" ry="9" fill="url(#goldGrad)"/>
  </g>
  <path d="M153 263 L261 263 L261 306 L207 328 L153 306 Z" fill="#EEB860"/>
  <path d="M153 306 L207 328" stroke="#D69634" stroke-width="2" stroke-opacity="0.9"/>
  <path d="M261 306 L207 328" stroke="#D69634" stroke-width="2" stroke-opacity="0.9"/>
  <rect x="153" y="263" width="108" height="136" rx="8" ry="8" fill="none"
        stroke="#FFF6DC" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="207" cy="340" r="34" fill="#FFD67A" stroke="#D68C22" stroke-width="3"/>
  <circle cx="207" cy="340" r="28" fill="none" stroke="#FFF0C8" stroke-opacity="0.55" stroke-width="2"/>
  <text x="207" y="356" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="46" font-weight="700" fill="#961E10" text-anchor="middle">￥</text>

  <!-- 文案 -->
  <text x="286" y="321" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="46" font-weight="700" fill="#FFF8EC">恭喜发财，大吉大利</text>
  <text x="287" y="389" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="30" font-weight="400" fill="#FFD6BE" fill-opacity="0.92">领取红包</text>

  <!-- 底部标识 -->
  <text x="142" y="526" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="22" font-weight="400" fill="#FFD0BA" fill-opacity="0.82">微信红包</text>
  <circle cx="255" cy="518" r="8" fill="#F7BE60"/>
  <text x="272" y="526" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="22" font-weight="400" fill="#FFD0BA" fill-opacity="0.68">微信支付</text>
</svg>
